name: release

# Push a tag like v0.2.0 on main to release that version. docs/releasing.md has the steps.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing, so no npm token is stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME points at a commit that is not on main. Merge the pull request first, then tag the merge commit." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: The tag matches the version in the code
        run: |
          version="$(bun -e 'console.log((await import("./src/version.ts")).version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but src/version.ts says $version. Bump both, then tag again." >&2
            exit 1
          fi
      - run: bun run verify
      - run: bun run build
      - run: bun run package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a rerun the release may exist with assets missing, so upload them again.
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --title "cagr $GITHUB_REF_NAME" --generate-notes
          fi
      # bun publish cannot use trusted publishing (OIDC) yet, so this step uses npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm packages, platform packages first
        run: |
          cd dist/npm
          for dir in cagr-* cagr; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            # npm view exits 0 with no output when the package exists but the version does not.
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm."
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
