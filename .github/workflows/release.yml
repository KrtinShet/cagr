name: release

# On every push to main:
#   1. release: when the version in src/version.ts has no tag yet (a release pull request was just
#      merged), tag that commit, publish the GitHub release and, when NPM_PUBLISH is on, npm.
#   2. release-pr: open or update the "chore(release): vX.Y.Z" pull request from the conventional
#      commits since the last release. Merging it starts step 1.
# Pushing a tag like v0.2.0 by hand still releases that tag. docs/releasing.md has the flow.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Each job asks for only what it needs.
permissions: {}

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing, so no npm token is stored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Decide whether to release
        id: plan
        run: |
          version="$(bun -e 'console.log((await import("./src/version.ts")).version)')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "src/version.ts says $version. Only plain x.y.z versions are released, so nothing is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "The tag is $GITHUB_REF_NAME but src/version.ts says $version. Bump both, then tag again." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "$GITHUB_REF_NAME points at a commit that is not on main. Merge the pull request first, then tag the merge commit." >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ]; then
            # This commit is the release itself: a rerun, so finish whatever did not get published.
            echo "$tag is this commit. Publishing again; parts already published are skipped."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag was released from an earlier commit. Nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no tag yet, so this commit releases it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.release == 'true'
        run: bun run verify
      - if: steps.plan.outputs.release == 'true'
        run: bun run build
      - if: steps.plan.outputs.release == 'true'
        run: bun run package
      - name: GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # On a rerun the release may exist with assets missing, so upload them again.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
          else
            # --target creates the tag on this commit when it does not exist yet.
            gh release create "$TAG" dist/release/* --target "$GITHUB_SHA" --title "cagr $TAG" --generate-notes
          fi
      # bun publish cannot use trusted publishing (OIDC) yet, so this step uses npm.
      # Off until the repo variable NPM_PUBLISH is "true": docs/releasing.md has the one-time npm setup.
      - if: steps.plan.outputs.release == 'true' && vars.NPM_PUBLISH == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm packages, platform packages first
        if: steps.plan.outputs.release == 'true' && vars.NPM_PUBLISH == 'true'
        run: |
          cd dist/npm
          for dir in cagr-* cagr; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            # npm view exits 0 with no output when the package exists but the version does not.
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm."
            else
              (cd "$dir" && npm publish --access public)
            fi
          done

  release-pr:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release branch
      pull-requests: write # the release pull request
      actions: write # start the tests on the release pull request
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Open or update the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/release
        run: |
          # The release job may have just made a tag.
          git fetch --tags --force origin
          bun scripts/next-version.ts --write > plan.json
          next="$(jq -r .next plan.json)"
          if [ "$next" = null ]; then
            echo "No feat or fix commit since $(jq -r .since plan.json). No release pull request needed."
            exit 0
          fi
          {
            echo "Merging this releases **v$next**: it tags the merge commit and publishes the GitHub release (and npm, when NPM_PUBLISH is on)."
            echo
            echo "Changes since $(jq -r .since plan.json):"
            echo
            jq -r '.commits[] | "- " + .' plan.json
            echo
            echo "## Testing"
            echo
            echo "The test workflow runs on this branch. The release job runs \`bun run verify\` again before it publishes."
            echo
            echo "## Risk"
            echo
            echo "Only the version in package.json and src/version.ts changes. The release ships every change listed above."
            echo
            echo "## How to revert"
            echo
            echo "Close this pull request to skip the release; it is opened again on the next push to main. After it is merged, delete the release and its tag, then fix forward with a new version."
            echo
            echo "This pull request is kept up to date by the release workflow. Do not edit it by hand."
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "chore(release): v$next"
          # The branch belongs to this workflow, so it is rewritten on every push to main.
          git push --force origin "$BRANCH"
          # Only this repo's own branch: a fork can open a pull request from a branch of the same name.
          number="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            -q '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore(release): v$next" --body-file body.md
          else
            gh pr create --base main --head "$BRANCH" --title "chore(release): v$next" --body-file body.md
          fi
          # Pushes made with the workflow token do not start other workflows, so start the tests by hand.
          gh workflow run test.yml --ref "$BRANCH"
