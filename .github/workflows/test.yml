name: test

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow starts it on the release pull request, which its own token cannot trigger.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      # e2e makes a Python project with uv.
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run cagr ci
      - run: bun run build --host
      - run: bun run e2e
